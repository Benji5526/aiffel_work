<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 별자리 & 12지신 운세</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="brand">🔮 오늘의운세</span>
      <span class="brand-badge">별자리 · 12지신</span>
    </div>
  </div>

  <main class="container">
    <section class="hero">
      <h1>모두를 위한<br />오늘의 별자리 &amp; 12지신 운세</h1>
      <p class="subtitle">이름과 생년월일만 입력하면 오늘 하루의 총운·애정운·금전운·건강운을<br class="br-desktop" />바로 확인할 수 있어요.</p>
    </section>

    <form id="fortune-form" class="card form-card">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="홍길동" maxlength="20" required />
      </div>
      <div class="field">
        <label for="birthDate">생년월일</label>
        <input type="date" id="birthDate" name="birthDate" min="1900-01-01" max="2099-12-31" required />
      </div>
      <button type="submit" id="submit-btn">오늘의 운세 보기</button>
      <p id="error-msg" class="error" hidden></p>
    </form>

    <section id="result" class="result-wrap" hidden>
      <div class="card profile-card">
        <div class="profile-row">
          <div class="avatar">🔮</div>
          <div class="profile-text">
            <div id="result-name" class="profile-name"></div>
            <div id="result-date" class="profile-date"></div>
          </div>
        </div>
        <div class="type-row">
          <div class="type-pill">
            <span id="western-symbol" class="type-symbol"></span>
            <div>
              <div id="western-sign" class="type-title"></div>
              <div class="type-sub">별자리</div>
            </div>
          </div>
          <div class="type-pill">
            <span id="chinese-symbol" class="type-symbol"></span>
            <div>
              <div id="chinese-animal" class="type-title"></div>
              <div class="type-sub">12지신</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">오늘의 운세 지수</h2>
        <div class="fortune-list">
          <div class="fortune-item" data-tone="overall">
            <div class="fortune-item-head">
              <span class="fortune-label">✨ 총운</span>
              <span id="score-overall" class="score"></span>
            </div>
            <div class="bar"><div id="bar-overall" class="bar-fill"></div></div>
            <p id="text-overall" class="fortune-text"></p>
          </div>
          <div class="fortune-item" data-tone="love">
            <div class="fortune-item-head">
              <span class="fortune-label">💗 애정운</span>
              <span id="score-love" class="score"></span>
            </div>
            <div class="bar"><div id="bar-love" class="bar-fill"></div></div>
            <p id="text-love" class="fortune-text"></p>
          </div>
          <div class="fortune-item" data-tone="money">
            <div class="fortune-item-head">
              <span class="fortune-label">💰 금전운</span>
              <span id="score-money" class="score"></span>
            </div>
            <div class="bar"><div id="bar-money" class="bar-fill"></div></div>
            <p id="text-money" class="fortune-text"></p>
          </div>
          <div class="fortune-item" data-tone="health">
            <div class="fortune-item-head">
              <span class="fortune-label">🌿 건강운</span>
              <span id="score-health" class="score"></span>
            </div>
            <div class="bar"><div id="bar-health" class="bar-fill"></div></div>
            <p id="text-health" class="fortune-text"></p>
          </div>
        </div>
      </div>

      <div class="card lucky-card">
        <h2 class="section-title">오늘의 행운 아이템</h2>
        <div class="lucky-row">
          <div class="lucky-item">
            <span class="lucky-label">행운의 색</span>
            <span id="lucky-color" class="lucky-value"></span>
          </div>
          <div class="lucky-item">
            <span class="lucky-label">행운의 숫자</span>
            <span id="lucky-number" class="lucky-value"></span>
          </div>
          <div class="lucky-item">
            <span class="lucky-label">행운의 아이템</span>
            <span id="lucky-item" class="lucky-value"></span>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <p>본 결과는 재미로 보는 콘텐츠이며 실제 운세와 무관합니다.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
