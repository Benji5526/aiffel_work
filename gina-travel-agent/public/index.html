<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gina - AI 여행 상담원</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="auth-screen" class="screen">
    <div class="card">
      <h1>Gina와 대화하기</h1>
      <p id="auth-mode-label">로그인하고 시작하세요.</p>
      <input id="email-input" type="email" placeholder="이메일" autocomplete="username" />
      <input id="auth-password-input" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button id="login-btn">로그인</button>
      <button id="signup-btn" class="secondary">회원가입</button>
      <p id="auth-msg" class="msg-line hidden"></p>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header>
      <h2>Gina - AI 여행 상담원</h2>
      <span id="user-label"></span>
      <button id="logout-btn">로그아웃</button>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="메시지를 입력하세요" autocomplete="off" />
      <button type="submit">전송</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
